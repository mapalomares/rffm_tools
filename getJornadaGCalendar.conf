[general]
# URL base del calendario de rffm.es (los parametros salen de cada equipo)
url_base = https://www.rffm.es/competicion/calendario

# Segundos de espera maxima para la descarga
timeout = 30

# true = verificacion TLS normal; tambien admite la ruta a un bundle PEM corporativo
verify = false

# Hora que se usa cuando la federacion aun no ha publicado la del partido
hora_defecto = 10:00

# Minutos de descanso que se suman a los dos tiempos de juego
descanso = 10

# Colores de Google Calendar
color_defecto = Grafito
color_equipo = Azulón

[duraciones]
# Minutos por parte segun la categoria detectada en el nombre de la competicion
prebenjamin = 20
benjamin = 25
alevin = 30
infantil = 35
cadete = 40
juvenil = 45
senior = 45
# Valor usado si no se reconoce la categoria
defecto = 45

[output]
# Carpeta de salida (relativa al script o absoluta)
folder = output

# Nombre del CSV ({equipo}, {jornada} y {fecha} se sustituyen)
filename = gcalendar_{equipo}_J{jornada}_{fecha}.csv

# Separador de columnas del CSV
delimiter = ,

[logs]
folder = logs
level = INFO

# ---------------------------------------------------------------------------
# Equipos configurados: una seccion [equipo:<NOMBRE>] por equipo.
# Se considera configurado el que tiene nombre, temporada, tipojuego,
# competicion y grupo. 'calendario' es el calendario destino de la carga.
# ---------------------------------------------------------------------------

[equipo:A.D. EL NORTE]
temporada = 22
tipojuego = 1
competicion = 26738323
grupo = 27131421
calendario = Moises

