[source]
# URL de la clasificacion del grupo en rffm.es (el parametro 'jornada' es irrelevante)
url = https://www.rffm.es/competicion/clasificaciones?temporada=22&tipojuego=1&competicion=26737828&grupo=26737840

# Segundos de espera maxima por peticion
timeout = 30

# Pausa en segundos entre la descarga de cada ficha de equipo (evita saturar el servidor)
delay = 0.5

[output]
# Carpeta de salida (relativa al script o absoluta)
folder = output

# Nombre del fichero Excel generado ({competicion}, {grupo} y {temporada} se sustituyen)
filename = equipos_{competicion}_{grupo}_{temporada}.xlsx

# Nombre de la hoja
sheet_name = Equipos

[logs]
folder = logs
level = INFO
