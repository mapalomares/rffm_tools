[source]
# URL del calendario de la competición en rffm.es
url = https://www.rffm.es/competicion/calendario?temporada=22&tipojuego=1&competicion=26738324&grupo=26738372

# Segundos de espera máxima para la descarga
timeout = 30

# true = verificación TLS normal; también admite la ruta a un bundle PEM corporativo
# Usa false solo temporalmente si no puedes obtener el certificado de la empresa
verify = false

[output]
# Carpeta de salida (relativa al script o absoluta)
folder = output

# Nombre del fichero Excel generado ({competicion}, {grupo} y {temporada} se sustituyen)
filename = calendario_{competicion}_{grupo}_{temporada}.xlsx

# Generar también PDF (true/false) y nombre del fichero
pdf = true
pdf_filename = calendario_{competicion}_{grupo}_{temporada}.pdf

# Generar un segundo PDF solo con los partidos del equipo seleccionado
compact_pdf = true
compact_pdf_filename = calendario_{competicion}_{grupo}_{temporada}_compacto.pdf

# Nombre de la hoja
sheet_name = Calendario

[highlight]
# Equipo a resaltar (coincidencia parcial, sin distinguir mayúsculas/acentos de formato)
team = C.D. SANTA BARBARA GETAFE 'E'

# Color de relleno de la fila (ARGB hex, sin #)
color = FFFFF2CC

[watermark]
# Marca de agua en el PDF, solo si el equipo elegido contiene 'team_match'
enabled = true
team_match = SANTA BARBARA
image = images/Santa_Barbara_logo.png
opacity = 0.10

[logs]
folder = logs
level = INFO
